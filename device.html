<!DOCTYPE html>
<html>
<head>
    <title>Device Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <section>
            <h1 class="section-title" id="title">Loading...</h1>
            <p class="muted">Device information pulled from database</p>
        </section>

        <div class="info-card devices">
            <div class="card-content">
                <p id="output">
                </p>
            </div>
        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        const DB_URL = "https://drainfiltertesting-default-rtdb.firebaseio.com/test.json";

        async function loadDevice() {
            const res = await fetch(DB_URL);
            const data = await res.json();

            const device = data[id];

            document.getElementById("title").textContent = "Filter ID: " + id;

            document.getElementById("output").textContent =
                JSON.stringify(device, null, 2);
            
                device
        }

        loadDevice();
    </script>

</body>
</html>
